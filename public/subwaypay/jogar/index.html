    <title>
        Subway Pay
    </title>
    <style>
        body,
        html {
            margin: 0;
            height: 100%;
            background-color: #0b316b;
            overflow: hidden;
            background-image: url('assets/preload/splash.png');
            background-repeat: no-repeat;
            background-position: center;
        }

        #message {
            text-align: center;
            font-size: 8px;
            z-index: 5;
            font-family: "Verdana", sans-serif;
            color: #fff;
            position: fixed;
            width: 100%;
            z-index: 9999;
        }

        .dot {
            display: inline;
            margin-left: 0.2em;
            margin-right: 0.2em;
            position: relative;
            top: -1em;
            font-size: 3.5em;
            opacity: 0;
            animation: showHideDot 2.5s ease-in-out infinite;
        }

        .dot.one {
            animation-delay: 0.2s;
        }

        .dot.two {
            animation-delay: 0.4s;
        }

        .dot.three {
            animation-delay: 0.6s;
        }

        @keyframes showHideDot {
            0% {
                opacity: 0;
            }

            50% {
                opacity: 1;
            }

            60% {
                opacity: 1;
            }

            100% {
                opacity: 0;
            }
        }

        button#sair {
            position: absolute;
            display: none;
            top: 135px;
            left: calc(50% - 130px);
            padding: .85rem 2.8rem;
            line-height: 32px;
            font-size: 18px;
            text-align: center;
            font-weight: 700;
            color: white;
            background-color: #1fbffe;
            box-shadow: -3px 3px 0 0 #1f2024;
            border: 4px solid #1f2024;
            border-radius: 8px;
            transition: background-color .2s ease, transform .2s ease, box-shadow .2s ease;
            z-index: 100000;
        }
    </style>
<link rel="stylesheet" href="../responsive.css">
<link rel="stylesheet" href="bridge.css"><link rel="stylesheet" href="run-hud.css?v=load17"><link rel="preload" href="js/dependencies.bundle.js?v=load17" as="script"><link rel="preload" href="js/index.js?v=load17" as="script"><style>
.game-tools.game-tools-bottom{inset:auto 0 max(16px,calc(env(safe-area-inset-bottom,0px) + 12px)) 0;z-index:100015;justify-content:center;padding-inline:16px;box-sizing:border-box}
.game-tools.game-tools-bottom #cashout{justify-content:center;min-height:52px;width:min(100%,340px);border-radius:16px;font-size:16px;box-shadow:0 8px 28px #0008;touch-action:manipulation}
.game-tools.game-tools-bottom #cashout[hidden]{display:none}
</style></head>

<body>


<div class="game-tools game-tools-bottom"><button type="button" id="cashout" hidden disabled><i data-lucide="banknote" aria-hidden="true"></i><span>Sacar agora</span></button></div>
<div class="run-hud" id="run-hud" aria-label="Informações da corrida"><div class="run-hud-card run-hud-meta"><small>Meta da corrida · 5×</small><strong id="hud-target">—</strong></div><div class="run-hud-card run-hud-total"><small>Moedas da corrida</small><strong id="hud-value">R$ 0,00</strong></div><strong class="run-hud-score" id="hud-score">000000</strong></div>
<dialog id="result"><img src="assets/preload/splash.png" alt="Subway Surfers"><div class="result-icon"><i id="result-icon" data-lucide="trophy"></i></div><h2 id="result-title"></h2><strong id="result-value"></strong><p id="result-detail"></p><button id="result-retry">Jogar novamente</button><button id="result-home" class="secondary">Voltar ao painel</button><small>Subway Pay Oficial · Corrida Valendo</small></dialog><dialog id="leave-dialog"><h2>Sair da corrida?</h2><p>Sair encerra a partida e solicita a confirmação do resultado. O contador de moedas acompanha o progresso. O resultado financeiro é confirmado pelo servidor.</p><button id="stay">Continuar jogando</button><button id="confirm-leave" class="secondary">Encerrar corrida</button></dialog><script>const aposta=1;localStorage.setItem('realBetPage','true');</script>
    <script>
        window.NOSW = true;
        window.GAME_CONFIG = {
            leaderboard: 'mockup',
            bundlesPath: './bundles',
        }
    </script>
    <div id="message">
        <h1>Loading</h1>
        <h1 class="dot one">.</h1>
        <h1 class="dot two">.</h1>
        <h1 class="dot three">.</h1>
    </div>

</html>
